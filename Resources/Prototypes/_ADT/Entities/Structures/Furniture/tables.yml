- type: entity
  abstract: true
  id: BaseRoundTable
  parent:
  - BaseStructure
  - StructureHealthFurniture
  components:
  - type: Animateable
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.5
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: SpriteFade
  - type: Sprite
    noRot: true
  - type: Icon
  - type: Climbable
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 4
    bonkSound: !type:SoundCollectionSpecifier
      collection: TrayHit
  - type: Anchorable
  - type: Rotatable
  - type: InteractionOutline
  - type: Tag
    tags:
    - ForceFixRotations

- type: entity
  id: TableRoundPlastic
  parent: BaseRoundTable
  name: plastic round table
  description: Do not apply fire to this. Rumour says it burns easily.
  components:
  - type: Damageable
    damageModifierSet: SteelStaticMod
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/metal_break1.ogg
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Sprite
    sprite: _ADT/Structures/Furniture/Tables/roundtable.rsi
    state: round_plastic
  - type: Icon
    sprite: _ADT/Structures/Furniture/Tables/roundtable.rsi
    state: round_plastic
  - type: Construction
    graph: FurnitureTableGraph
    node: tableRoundPlastic

- type: entity
  id: TableRoundWood
  parent: TableRoundPlastic
  name: wood round table
  description: Do not apply fire to this. Rumour says it burns easily.
  components:
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Sprite
    state: round_wood
  - type: Icon
    state: round_wood
  - type: Construction
    node: tableRoundWood

- type: entity
  id: TableRoundGlass
  parent: TableRoundPlastic
  name: glass round table
  description: Do not apply fire to this. Rumour says it burns easily.
  components:
  - type: GlassTable
    climberDamage:
      types:
        Slash: 30
    tableDamage:
      types:
        Blunt: 100
    tableMassLimit: 60
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/glass_break2.ogg
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Sprite
    state: round_glass
  - type: Icon
    state: round_glass
  - type: Construction
    node: tableRoundGlass

- type: entity
  id: TableRoundFrame
  parent: BaseRoundTable
  name: round table frame
  description: Pieces of metal that make the frame of a round table.
  components:
  - type: Damageable
    damageModifierSet: SteelStaticMod
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/metal_break1.ogg
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Sprite
    sprite: _ADT/Structures/Furniture/Tables/roundtable.rsi
    state: round_frame
  - type: Icon
    sprite: _ADT/Structures/Furniture/Tables/roundtable.rsi
    state: round_frame
  - type: Construction
    graph: FurnitureTableGraph
    node: tableRoundFrame

- type: entity
  id: TableRoundGeneric
  parent: TableRoundPlastic
  name: round table
  description: A round piece of metal standing on a metal leg.
  components:
  - type: Sprite
    state: round_generic
  - type: Icon
    state: round_generic
  - type: Construction
    node: tableRoundGeneric

- type: entity
  id: TableRoundCarpet
  parent: TableRoundPlastic
  name: gambling round table
  description: Play em' cowboy.
  components:
  - type: Sprite
    state: round_carpet
  - type: Icon
    state: round_carpet
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts:
        - Destruction
    - trigger: !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1
            max: 1
          MaterialCloth1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Tag
    tags:
    - Wooden
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCarpet
  - type: Construction
    node: tableRoundCarpet

- type: entity
  id: TableRoundPlasma
  parent: TableRoundPlastic
  name: plasma round table
  description: A round piece of plasma glass, standing on a metal leg. Pretty!
  components:
  - type: GlassTable
    climberDamage:
      types:
        Slash: 30
    tableDamage:
      types:
        Blunt: 100
    tableMassLimit: 240
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Sprite
    state: round_plasma
  - type: Icon
    state: round_plasma
  - type: Construction
    node: tableRoundPlasma

- type: entity
  id: TablePlastic
  parent:
  - TableBase
  - StructureHealthFurniture
  name: plastic table
  description: A square piece of plastic, standing on four metal legs.
  components:
  - type: Sprite
    sprite: _ADT/Structures/Furniture/Tables/plastic.rsi
  - type: Icon
    sprite: _ADT/Structures/Furniture/Tables/plastic.rsi
  - type: Damageable
    damageModifierSet: SteelStaticMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: TableFrame
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: IconSmooth
    key: plastictable
    states:
    - !type:CornerSpriteSmoothing
      mask: [ plastictable ]
      base: state_
  - type: Construction
    graph: Table
    node: TablePlastic
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepTile

