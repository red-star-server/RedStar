- type: entity
  parent: Bed
  id: DoubleBed
  name: double bed
  description: A large bed for two people. Can place two bedsheets and buckle two people.
  components:
  - type: Sprite
    sprite: _ADT/Structures/Furniture/bed_double.rsi
    state: bed_double
  - type: Construction
    graph: DoubleBedGraph
    node: double_bed_complete
  - type: Appearance
  - type: Strap
    size: 200
    buckleOffset: 0,-0.25
