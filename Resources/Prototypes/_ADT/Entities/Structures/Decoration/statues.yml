- type: entity
  abstract: true
  parent: BaseStatue
  id: BaseTallStatue
  components:
  - type: Sprite
    noRot: true
    offset: 0.0,0.5
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.5,-0.5,0.5,1.5

- type: entity
  abstract: true
  parent: BaseStatue
  id: BaseBust
  components:
  - type: Sprite
    noRot: true
    offset: 0.0,0.5
    sprite: _ADT/Structures/Decoration/Statues/busts.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.3,-0.3,0.3,0.8

- type: entity
  abstract: true
  parent: BaseStatue
  id: BaseMarbleStatue
  components:
  - type: Sprite
    noRot: true
    offset: 0.0,0.5

- type: entity
  parent: BaseMarbleStatue
  id: MarbleLady
  name: beutiful marble lady
  description: She's so pretty
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialMarble1:
            min: 4
            max: 6
      - !type:DoActsBehavior
        acts:
        - Destruction
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -2
  - type: Sprite
    sprite: _ADT/Structures/Decoration/Statues/marble_lady.rsi
    state: marlady
  - type: Construction
    graph: MarbleStatueLady
    node: marblestatueLady

- type: entity
  parent: MarbleLady
