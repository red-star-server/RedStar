  description: An angel-guardian who protects you from all troubles and misfortunes. Guardian-protector, and in the difficult hour of your life, he will help you
    overcome difficulties, guardian!
  components:
  - type: Sprite
    sprite: _ADT/Structures/Decoration/Statues/angel.rsi
    state: angel
  - type: Construction
    graph: DecorativeStatueGraph
    node: statueAngel

