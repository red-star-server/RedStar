- type: entity
  id: FireplaceBase
  abstract: true
  parent: [BaseStructure, StructureHealthFurnitureStrong]
  components:
  - type: Appearance
  - type: AmbientSound
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: PointLight
    radius: 3
    energy: 3
    color: '#FF6F00'
  - type: Damageable
    damageModifierSet: SteelStaticMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: AlwaysHot

- type: entity
  id: FireplaceWhite
  parent: FireplaceBase
  name: white fireplace
  description: An elegant white fireplace that fills the room with warmth.
  components:
  - type: Sprite
    sprite: _ADT/Structures/Decoration/fireplace.rsi
    layers:
    - state: fireplace
    - state: fire
      shader: unshaded
    - state: glow
      shader: unshaded
  - type: Construction
    graph: Fireplace
    node: fireplaceWhite

- type: entity
  id: FireplaceWooden
  parent: FireplaceBase
  name: wooden fireplace
  description: An elegant wooden fireplace that fills the room with warmth.
  components:
  - type: Sprite
    sprite: _ADT/Structures/Decoration/fireplace.rsi
    layers:
    - state: fireplace_wooden
    - state: fire_wooden
      shader: unshaded
    - state: glow_wooden
      shader: unshaded
  - type: Construction
    graph: Fireplace
    node: fireplaceWooden
