- type: entity
  id: FireplaceBase
  parent: BaseStructure
  components:
  - type: Appearance
  - type: AmbientSound
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: PointLight
    radius: 3
    energy: 3
    color: "#FF6F00"
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: AlwaysHot

- type: entity
  id: FireplaceWhite
  parent: FireplaceBase
  name: белый камин
  description: Изысканный белый камин. Может быть зажжён для создания уютной атмосферы.
  components:
  - type: Sprite
    sprite: _ADT/Structures/Decoration/fireplace.rsi
    layers:
    - state: fireplace
    - state: fire
      shader: unshaded
    - state: glow
      shader: unshaded
  - type: Construction
    graph: Fireplace
    node: fireplaceWhite

- type: entity
  id: FireplaceWooden
  parent: FireplaceBase
  name: деревянный камин
  description: Изысканный деревянный камин. Может быть зажжён для создания уютной атмосферы.
  components:
  - type: Sprite
    sprite: _ADT/Structures/Decoration/fireplace.rsi
    layers:
    - state: fireplace_wooden
    - state: fire_wooden
      shader: unshaded
    - state: glow_wooden
      shader: unshaded
  - type: Construction
    graph: Fireplace
    node: fireplaceWooden
