- type: entity
  id: SteelDarkCenterStairs
  name: stairs
  suffix: Steel , center
  description: The greatest invention since rocket-propelled grenades.
  components:
  - type: Sprite
    sprite: _ADT/Structures/stairs.rsi
    state: steel_dark_center_stairs
  - type: Damageable
    damageModifierSet: SteelStaticMod
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepTile
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts:
        - Destruction
  parent:
  - BaseFloorDecoration
  - StructureHealthFurnitureStrong
