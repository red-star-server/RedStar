- type: entity
  name: deli stand
  id: DeliStand
  parent: [ BaseStructureDynamic, StructureHealthFurniture ]
  description: A counter for displaying food in a deli.
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: _Starlight/Structures/Furniture/deli_stand.rsi
    layers:
    - state: deli_stand
    - map: ["enum.StorageFillLayers.Fill"]
      state: fill-0
    noRot: true
    offset: 0, 0.25
    drawdepth: OverMobs
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.3,0.5,0.3"
        density: 55
        mask: # tables should collide with other tables
        - TableMask
        layer:
        - TableLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: Storage
    grid:
    - 0,0,9,2
    quickInsert: true
    whitelist:
      components:
      - Edible
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 3
    fillBaseName: fill
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: DnaSubstanceTrace
