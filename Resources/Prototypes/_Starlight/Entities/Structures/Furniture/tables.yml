  - type: Icon
    sprite: _Starlight/Structures/Furniture/Tables/wood_counter.rsi
  - type: IconSmooth
    key: counterretrowood
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 0
            max: 1
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood
  - type: Construction
    graph: CounterRetroWood
    node: CounterRetroWood

