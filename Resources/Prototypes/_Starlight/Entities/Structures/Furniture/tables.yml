- type: entity
  id: TableCounterRetroSteel
  parent: [ CounterBase, StructureHealthFurniture ]
  name: retro steel counter
  description: Looks like a good place to put a drink down.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Furniture/Tables/steel_counter.rsi
  - type: Icon
    sprite: _Starlight/Structures/Furniture/Tables/steel_counter.rsi
  - type: IconSmooth
    key: counterretrosteel
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 1
  - type: Construction
    graph: CounterRetroSteel
    node: CounterRetroSteel

- type: entity
  id: TableCounterRetroWood
  parent: [ CounterBase, StructureHealthFurniture ]
  name: retro wood counter
  description: Looks like a good place to put a drink down.
  components:
