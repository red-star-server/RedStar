- type: entity
  name: watcher
  id: MobWatcherBase
  parent: [ SimpleSpaceMobBase, FlyingMobBase, BaseSlicingRefinable, BaseMobDestructible ]
  abstract: true
  description: It's like it's staring right through you.
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _RedStar/Mobs/Aliens/Lavaland/watcher.rsi # RS14
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: watcher # RS14
    #- map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
    #  state: unshaded
    #  shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
          - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: watcher # RS14
        #BaseUnshaded: unshaded # RS14
      Dead:
        Base: watcher_dead # RS14
        #BaseUnshaded: dead-unshaded # RS14
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: ToolRefinable
    refineResult:
    - id: DiamondOre1
      amount: 1
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 7
  - type: BatteryAmmoProvider
    proto: WatcherBolt
    fireCost: 50
  - type: BatterySelfRecharger
    autoRechargeRate: 50
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Gun
    fireRate: 0.5
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: CombatMode
  - type: InteractionPopup
    successChance: 0.3
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/Animals/lizard_happy.ogg

- type: entity
  id: MobWatcherLavaland
  parent: MobWatcherBase
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: watcher
    #- map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
    #  state: unshaded
    #  shader: unshaded
    #  color: red
  - type: PointLight
    radius: 1
    energy: 3
    color: red

- type: entity
  id: MobWatcherIcewing
  parent: MobWatcherBase
  name: icewing watcher
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: watcher_icewing # RS14
    #- map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ] # RS14
    #  state: unshaded
    #  shader: unshaded
    #  color: deepskyblue
  - type: PointLight
    radius: 1
    energy: 3
    color: deepskyblue
  - type: DamageStateVisuals # RS14
    states:
      Alive:
        Base: watcher_icewing
      Dead:
        Base: watcher_icewing_dead

- type: entity
  id: MobWatcherMagmawing
  parent: MobWatcherBase
  name: magmawing watcher
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: watcher_magmawing # RS14
    #- map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ] # RS14
    #  state: unshaded
    #  shader: unshaded
    #  color: orangered
  - type: PointLight
    radius: 1
    energy: 3
    color: orangered
  - type: BatteryAmmoProvider
    proto: WatcherBoltMagmawing
    fireCost: 50
  - type: DamageStateVisuals # RS14
    states:
      Alive:
        Base: watcher_magmawing
      Dead:
        Base: watcher_magmawing_dead

