- type: entity
  abstract: true
  parent: [ BaseMobSlimes, SimpleMobBase, MobCombat, BaseSlicingRefinableButchering, MobNightVision, BaseMobDestructible ]
  id: BaseMobAdultSlimes
  name: basic slime
  description: It looks so much like jelly. I wonder what it tastes like?
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RedStar/Mobs/XenoSlimes/blue.rsi # RS14
    # RS14-start
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: adult
    - map: ["enum.SlimeVisualLayers.Digesting"]
      visible: false
    # RS14-end
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatSlime
      amount: 2
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.2
    damageRecovery:
      types:
        Asphyxiation: -1.0
    maxSaturation: 15
  - type: Damageable
    damageModifierSet: Slime
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Slime
        Quantity: 150
    bloodlossDamage:
      types:
        Bloodloss:
          0.5
    bloodlossHealDamage:
      types:
        Bloodloss:
          -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.45
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: 0.05 #Same as slime species
      - !type:PopupMessage
        type: Local
        messages: [ "slime-hurt-by-water-popup" ]
        probability: 0.25
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
        path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 6
        Caustic: 4
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
    allowedEmotes: ['Squish']
  - type: TypingIndicator
    proto: slime
  # RS14-start
  - type: Satiation
    satiations:
      Hunger:
        prototype: SlimeHunger # RS14
  - type: Slime
  - type: SlimeDigestion
  - type: Appearance
  - type: SlimeDigestionVisuals
  - type: TemperatureDamage
    coldDamage:
      types:
        Cold: 10.0
  - type: Butcherable
    butcherDelay: 20
    spawned: []
  - type: DamageStateVisuals
    states:
      Alive:
        Base: adult
      Dead:
        Base: baby-dead
  # RS14-end

- type: entity
  abstract: true
  parent: BaseMobAdultSlimes
  id: MobAdultSlimes
  name: basic slime
  description: It looks so much like jelly. I wonder what it tastes like?
  components:
  - type: ReplacementAccent
    accent: slimes
  - type: GhostTakeoverAvailable
  - type: GhostRole
    prob: 0.05
    makeSentient: true
    name: ghost-role-information-slimes-name
    description: ghost-role-information-slimes-description
    rules: ghost-role-information-nonantagonist-rules
    raffle:
      settings: short
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    rootTask:
      task: SlimeCombatCompound # RS14
  - type: NPCRetaliation
    attackMemoryLength: 10
  # RS14-start
  - type: SlimeMutation
  - type: SlimeMitosis
    minInterval: 90s
    maxInterval: 120s
    gestationDuration: 60s
    hungerPerBirth: 75
    offspringCount: 2
    offspringPrototype: MobBabySlimesBlue
  # RS14-end

- type: entity
  abstract: true
  id: BaseAdultSlimesAngry
  name: base angry slime
  components:
  - type: NpcFactionMember
    factions:
      - SimpleHostile
  - type: GhostRole
    prob: 1
    description: ghost-role-information-angry-slimes-description
    rules: ghost-role-information-angry-slimes-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: short

- type: entity
  parent: MobAdultSlimes
  id: MobAdultSlimesBlue
  name: blue slime
  components:
  - type: DamageStateVisuals
    states:
      Alive:
        Base: adult # RS14
      Dead:
        Base: baby-dead # RS14
  # RS14-start
  - type: Butcherable
    spawned:
    - id: BlueSlimeExtract
      amount: 1
  - type: SlimeMutation
    mutations:
    - target: MobBabySlimesDarkBlue
    - target: MobBabySlimesSilver
    - target: MobBabySlimesPink
      weight: 2
  # RS14-end

- type: entity
  parent: [ BaseAdultSlimesAngry, MobAdultSlimesBlue ]
  id: MobAdultSlimesBlueAngry
  name: blue slime
  suffix: Angry

