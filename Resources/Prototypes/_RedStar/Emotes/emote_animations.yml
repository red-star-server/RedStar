- type: entity
  abstract: true
  id: BaseEmoteAnimations
  components:
  - type: EmoteAnimation
    animations:
      Flip: Flip
      Jump: Jump
      Spin: Spin
      Tremble: Tremble
      Shiver: Tremble
      Shudder: Tremble

- type: emote
  id: Flip
  name: chat-emote-name-flip
  category: Animations
  icon: Interface/Emotes/somersaults.png
  whitelist:
    components:
    - EmoteAnimation
  chatMessages:
  - chat-emote-msg-flip
  chatTriggers:
  - сальто
  - делает сальто
  - сделал сальто
  - сделала сальто
  - flip
  - flips
  - does a flip

