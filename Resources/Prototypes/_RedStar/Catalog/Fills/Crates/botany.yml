- type: entity
  parent: CrateHydroponics
  id: CrateHydroponicsBeekeeping
  name: beekeeping crate
  description: A flat-packed beehive, two hive frames, and a packaged queen bee. No bees inside, the colony starts when the queen goes into the hive.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BeehiveFlatpack
        - id: BeeFrame
          amount: 2
        - id: BeeQueenPackage

- type: entity
  parent: CrateHydroponics
  id: CrateHydroponicsBeeQueen
  name: queen bee crate
  description: A packaged queen bee. Put her into a hive with frames, and a colony starts.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BeeQueenPackage

- type: entity
  parent: CrateHydroponics
  id: CrateHydroponicsBeeFrames
  name: hive frames crate
  description: Four empty hive frames.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BeeFrame
          amount: 4
