  - !type:AddComponents
    components:
    - type: Pacified

- type: cellTrait
  id: OwO
  name: cell-trait-OwO-name
  color: "#ff66aa"
  effects:
  - !type:AddComponents
    components:
    - type: OwOAccent

- type: cellTrait
  id: NightVision
  fusionIngredient: true
  name: cell-trait-NightVision-name
  color: "#44cc44"
  effects:
  - !type:AddComponents
    components:
    - type: NightVision

- type: cellTrait
  id: EggLayer
  fusionIngredient: true
  name: cell-trait-EggLayer-name
  color: "#f5e7ba"
  effects:
  - !type:AddComponents
    components:
    - type: EntityProducerAction
      insufficientSatiationPopup: action-popup-lay-egg-too-hungry
      userPopup: action-popup-lay-egg-user
      othersPopup: action-popup-lay-egg-others
    - type: SatiationProduction
      delay: 60
      delayMax: 120
      satiationUsage: 60
      minimumSatiation: 60
      automaticForPlayers: false
    - type: EntityProducer
      table:
        id: FoodEgg
    - type: ActionGrant
      actions:
      - ActionAnimalLayEgg

- type: cellTrait
  id: Lactation
  fusionIngredient: true
  name: cell-trait-Lactation-name
  color: "#fff7dc"
  effects:
  - !type:ContainedSolutionEffect
    prototype: SolutionUdder
    solutionName: udder
  - !type:AddComponents
    components:
    - type: HarvestableSolution
      solutionName: udder
      verbText: udder-system-verb-milk
      emptyMessage: udder-system-dry
      successMessage: udder-system-success

- type: cellTrait
  id: Venomous
  fusionIngredient: true
  name: cell-trait-Venomous-name
  color: "#88dd44"
  effects:
  - !type:ContainedSolutionEffect
    prototype: SolutionVenomSpider
    solutionName: melee
  - !type:AddComponents
    components:
    - type: MeleeChemicalInjector
      transferAmount: 1
      solution: melee

- type: cellTrait
  id: WebSpinning
  fusionIngredient: true
