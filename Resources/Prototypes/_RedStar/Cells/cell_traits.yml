    components:
    - type: Spider

- type: cellTrait
  id: Regeneration
  fusionIngredient: true
  name: cell-trait-Regeneration-name
  color: "#44ff88"
  effects:
  - !type:AddComponents
    components:
    - type: PassiveDamage
      interval: 3s
      allowedStates:
      - Alive
      damage:
        types:
          Blunt: -0.25
          Slash: -0.25
          Piercing: -0.25
          Heat: -0.25
          Shock: -0.25
          Cold: -0.25
          Caustic: -0.25

