- type: cellTrait
  id: Pacifism
  gene: Pacifism
  effects:
  - !type:AddComponents
    components:
    - type: Pacified

- type: cellTrait
  id: OwO
  gene: OwO
  effects:
  - !type:AddComponents
    components:
    - type: OwOAccent

- type: cellTrait
  id: NightVision
  gene: NightVision
  effects:
  - !type:AddComponents
    components:
    - type: NightVision

- type: cellTrait
  id: EggLayer
  gene: EggLayer
  effects:
  - !type:AddComponents
    components:
    - type: EntityProducerAction
      insufficientSatiationPopup: action-popup-lay-egg-too-hungry
      userPopup: action-popup-lay-egg-user
      othersPopup: action-popup-lay-egg-others
    - type: SatiationProduction
      delay: 60
      delayMax: 120
      satiationUsage: 60
      minimumSatiation: 60
      automaticForPlayers: false
    - type: EntityProducer
      table:
        id: FoodEgg
    - type: ActionGrant
      actions:
      - ActionAnimalLayEgg

- type: cellTrait
  id: Lactation
  gene: Lactation
  effects:
  - !type:ContainedSolutionEffect
    prototype: SolutionUdder
    solutionName: udder
  - !type:AddComponents
    components:
    - type: HarvestableSolution
      solutionName: udder
      verbText: udder-system-verb-milk
      emptyMessage: udder-system-dry
      successMessage: udder-system-success

- type: cellTrait
  id: Venomous
  gene: Venomous
  effects:
  - !type:ContainedSolutionEffect
    prototype: SolutionVenomSpider
    solutionName: melee
  - !type:AddComponents
    components:
    - type: MeleeChemicalInjector
      transferAmount: 1
      solution: melee

- type: cellTrait
  id: WebSpinning
  gene: WebSpinning
  effects:
  - !type:AddComponents
    components:
    - type: Spider

- type: cellTrait
  id: Regeneration
  gene: Regeneration
  effects:
  - !type:AddComponents
    components:
    - type: PassiveDamage
      interval: 3s
      allowedStates:
      - Alive
      damage:
        types:
          Blunt: -0.25
          Slash: -0.25
          Piercing: -0.25
          Heat: -0.25
          Shock: -0.25
          Cold: -0.25
          Caustic: -0.25

- type: cellTrait
  id: NoSlip
  gene: NoSlip
  effects:
  - !type:AddComponents
    components:
    - type: NoSlip

- type: cellTrait
  id: Reflection
  gene: Reflection
  effects:
  - !type:AddComponents
    components:
    - type: Reflect
      reflectProb: 0.5

- type: cellTrait
  id: Invisibility
  gene: Invisibility
  effects:
  - !type:AddComponents
    components:
    - type: Stealth
    - type: StealthOnMove

- type: cellTrait
  id: Radiation
  gene: Radiation
  effects:
  - !type:AddComponents
    components:
    - type: RadiationSource

- type: cellTrait
  id: Reform
  gene: Reform
  effects:
  - !type:AddComponents
    components:
    - type: Reform
      actionPrototype: DionaReformAction
      reformTime: 10
      popupText: diona-reform-attempt
      reformPrototype: MobDionaReformed

- type: cellTrait
  id: MessyDrinker
  gene: MessyDrinker
  effects:
  - !type:AddComponents
    components:
    - type: MessyDrinker

- type: cellTrait
  id: ParrotSpeech
  gene: ParrotSpeech
  effects:
  - !type:AddComponents
    components:
    - type: ActiveListener
    - type: ParrotMemory
    - type: ParrotListener
    - type: Vocalizer

- type: cellTrait
  id: Bleating
  gene: Bleating
  effects:
  - !type:AddComponents
    components:
    - type: BleatingAccent
