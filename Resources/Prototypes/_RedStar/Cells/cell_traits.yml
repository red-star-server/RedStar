  color: "#b4e514"
  effects:
  - !type:AddComponents
    components:
    - type: Pacified

- type: cellTrait
  id: OwO
  gene: OwO
  name: cell-trait-OwO-name
  color: "#ff66aa"
  effects:
  - !type:AddComponents
    components:
    - type: OwOAccent

- type: cellTrait
  id: NightVision
  gene: NightVision
  name: cell-trait-NightVision-name
  color: "#44cc44"
  effects:
  - !type:AddComponents
    components:
    - type: NightVision

- type: cellTrait
  id: EggLayer
  gene: EggLayer
  name: cell-trait-EggLayer-name
  color: "#f5e7ba"
  effects:
  - !type:AddComponents
    components:
    - type: EntityProducerAction
      insufficientSatiationPopup: action-popup-lay-egg-too-hungry
      userPopup: action-popup-lay-egg-user
      othersPopup: action-popup-lay-egg-others
    - type: SatiationProduction
      delay: 60
      delayMax: 120
      satiationUsage: 60
      minimumSatiation: 60
      automaticForPlayers: false
    - type: EntityProducer
      table:
        id: FoodEgg
    - type: ActionGrant
      actions:
      - ActionAnimalLayEgg

- type: cellTrait
  id: Lactation
  gene: Lactation
  name: cell-trait-Lactation-name
  color: "#fff7dc"
  effects:
  - !type:ContainedSolutionEffect
    prototype: SolutionUdder
    solutionName: udder
  - !type:AddComponents
    components:
    - type: HarvestableSolution
      solutionName: udder
      verbText: udder-system-verb-milk
      emptyMessage: udder-system-dry
      successMessage: udder-system-success

- type: cellTrait
  id: Venomous
  gene: Venomous
  name: cell-trait-Venomous-name
  color: "#88dd44"
  effects:
  - !type:ContainedSolutionEffect
    prototype: SolutionVenomSpider
    solutionName: melee
  - !type:AddComponents
    components:
    - type: MeleeChemicalInjector
      transferAmount: 1
      solution: melee

- type: cellTrait
  id: WebSpinning
  gene: WebSpinning
  name: cell-trait-WebSpinning-name
  color: "#eeeeee"
  effects:
  - !type:AddComponents
    components:
    - type: Spider

- type: cellTrait
  id: Regeneration
  gene: Regeneration
  name: cell-trait-Regeneration-name
  color: "#44ff88"
  effects:
  - !type:AddComponents
    components:
    - type: PassiveDamage
      interval: 3s
      allowedStates:
      - Alive
      damage:
        types:
          Blunt: -0.25
          Slash: -0.25
          Piercing: -0.25
          Heat: -0.25
          Shock: -0.25
          Cold: -0.25
          Caustic: -0.25

