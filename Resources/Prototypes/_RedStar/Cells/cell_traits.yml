# Mutation-only traits (obtained through fusion).
- type: cellTrait
  id: ToxicMutation
  fusionMutation: true
  name: cell-trait-ToxicMutation-name
  color: "#66ff00"
  effects:
  - !type:AddComponents
    components:
    - type: DamageContacts
      damage:
        types:
          Poison: 1

- type: cellTrait
  id: BioLuminescentMutation
  fusionMutation: true
  name: cell-trait-BioLuminescentMutation-name
  color: "#44ddff"
  effects:
  - !type:Glow
    color: "#44ddff"
    radius: 2

- type: cellTrait
  id: VolatileMutation
  fusionMutation: true
  name: cell-trait-VolatileMutation-name
  color: "#ff4400"
  effects:
  - !type:AddComponents
    components:
    - type: TriggerOnMobstateChange
      keyOut: xenobiology-volatile
      mobState:
      - Dead
    - type: ExplodeOnTrigger
      keysIn:
      - xenobiology-volatile
    - type: Explosive
      explosionType: Default
      totalIntensity: 10
      intensitySlope: 5
      maxIntensity: 20
      canCreateVacuum: false
      deleteAfterExplosion: false
