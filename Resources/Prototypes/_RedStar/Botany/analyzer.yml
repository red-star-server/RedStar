# RS14: plant analyzer, available at shift start, in the botanist's locker and in the protolathe.

- type: entity
  parent: BaseHandheldComputer
  id: RedStarPlantAnalyzer
  name: plant analyzer
  description: A handheld device for analyzing plants and seeds.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/healthanalyzer.rsi
    state: icon
  - type: Item
    storedRotation: -90
  - type: ActivatableUI
    key: enum.RedStarPlantAnalyzerUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.RedStarPlantAnalyzerUiKey.Key:
        type: RedStarPlantAnalyzerBoundUserInterface
  - type: RedStarPlantAnalyzer
    scanDelay: 0.5
    advancedScanDelay: 1

- type: latheRecipe
  parent: BaseToolRecipe
  id: RedStarPlantAnalyzer
  result: RedStarPlantAnalyzer
  categories: [Tools]
  completetime: 3
  materials:
    Steel: 500
    Glass: 500
    Plastic: 100
    Gold: 100

- type: latheRecipePack
  id: RedStarBotanyProtolatheStatic
  recipes: [RedStarPlantAnalyzer]
