- type: entity
  name: slime extract bag
  id: SlimeExtractBag
  parent: BaseStorageItem
  description: A bag for greedy xenobiologists to store unreasonable amounts of extracts.
  components:
  - type: Sprite
    sprite: _RedStar/Clothing/Belt/xenobag.rsi
    state: icon
  - type: Item
    storedRotation: -90
  - type: Clothing
    quickEquip: false
    slots:
    - belt
  - type: Storage
    grid:
    - 0,0,10,10
    maxItemSize: Tiny
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
      - SlimeExtract
  - type: Dumpable


