- type: entity
  parent: [ BaseMachine, BaseMachineDestructible ]
  id: XenobiologyCellScanner
  name: xenobiology cell scanner
  description: Detects nearby living slimes for a linked xenobiology console.
  components:
  - type: XenobiologyCellScanner
    detectionRadius: 4
    updateInterval: 0.75
  - type: DeviceLinkSink
    ports: [ XenobiologyCellScanner ]
  - type: Physics
    canCollide: false
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _RedStar/Structures/Machines/slime_scanner.rsi
    state: gsensor1
