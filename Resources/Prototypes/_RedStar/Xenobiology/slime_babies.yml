- type: entity
  id: MobBabySlimes
  parent: BaseMobAdultSlimes
  abstract: true
  components:
  - type: Sprite
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: baby
    - map: ["enum.SlimeVisualLayers.Digesting"]
      visible: false
  - type: SlimeDigestion
    preyWhitelist:
      sizes: [Tiny, Small]
  - type: SlimeDigestionVisuals
    interiorSize: [0.4, 0.35]
    interiorOffset: [0, -0.15]
  - type: TimedMetamorphosis
    target: MobAdultSlimesBlue
    duration: 120s
  - type: HTN
    rootTask:
      task: SlimeCombatCompound
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: baby
      Dead:
        Base: baby-dead

- type: entity
  id: MobBabySlimesGray
  name: baby gray slime
  parent: MobBabySlimes
  components:
  - type: TimedMetamorphosis
    target: MobAdultSlimesGray
  - type: Sprite
    sprite: _RedStar/Mobs/XenoSlimes/gray.rsi

