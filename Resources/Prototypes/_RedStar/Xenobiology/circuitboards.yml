- type: entity
  parent: BaseComputerCircuitboard
  id: XenobiologyDatabaseConsoleCircuitboard
  name: xenobiology database console board
  description: A computer printed circuit board for a xenobiology database console.
  components:
  - type: Sprite
    state: cpu_science
  - type: ComputerBoard
    prototype: XenobiologyDatabaseConsole

- type: entity
  parent: BaseMachineCircuitboard
  id: XenobiologySampleAnalyzerMachineCircuitboard
  name: xenobiology sample analyzer machine board
  description: A machine printed circuit board for a xenobiology sample analyzer.
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: XenobiologySampleAnalyzer
    stackRequirements:
      Manipulator: 1
      Glass: 5
