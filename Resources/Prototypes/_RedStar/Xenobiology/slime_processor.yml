- type: entity
  id: XenobiologySlimeProcessor
  parent: BaseMachinePowered
  name: slime processor
  description: Processes dead slimes into physical extracts.
  components:
  - type: Sprite
    sprite: _RedStar/Structures/Machines/slime_processor.rsi
    layers:
    - state: processor
      map: ["enum.SlimeProcessorVisualLayers.Main"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SlimeProcessorVisuals.Processing:
        enum.SlimeProcessorVisualLayers.Main:
          True: { state: processor_on }
          False: { state: processor }
  - type: Transform
    anchored: true
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: SlimeProcessor
    processingTime: 5
    slimeAcquireCooldown: 1
  - type: ContainerContainer
    containers:
      slimes: !type:Container
