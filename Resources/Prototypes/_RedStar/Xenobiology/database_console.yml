- type: entity
  parent: BaseComputer
  id: XenobiologyDatabaseConsole
  name: xenobiology database console
  description: Displays catalogued xenobiology research samples from a connected R&D server.
  components:
  - type: Computer
    board: XenobiologyDatabaseConsoleCircuitboard
  - type: ResearchClient
  - type: XenobiologyDatabaseConsole
  - type: ActivatableUI
    key: enum.XenobiologyDatabaseConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.XenobiologyDatabaseConsoleUiKey.Key:
        type: XenobiologyDatabaseConsoleBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _RedStar/Structures/Machines/slime_computer.rsi
      state: slime
    - map: ["computerLayerKeys"]
      sprite: _RedStar/Structures/Machines/slime_computer.rsi
      state: slime_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
