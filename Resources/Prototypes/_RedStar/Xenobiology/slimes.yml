- type: entity
  id: XenobiologySlimeBase
  parent:
  - MobRespirator
  - MobAtmosStandard
  - SimpleSpaceMobBase
  abstract: true
  description: I don't think you should be seeing this.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RedStar/Mobs/XenoSlimes/gray.rsi
    layers:
    - state: adult
  - type: Satiation
    satiations:
      Hunger:
        prototype: XenobiologySlimeHunger
  - type: SlimeHusbandry
    overcrowdingRadius: 2.5
    restlessThreshold: 3
    aggressiveThreshold: 5
    restlessBelow: Okay
    aggressiveBelow: Starving
    calmGrowthMultiplier: 1
    restlessGrowthMultiplier: 0.5
    aggressiveGrowthMultiplier: 0
  - type: Slime
    damageOnEat:
      types:
        Cellular: 5
    nutritionOnHit: 10
  - type: HTN
    rootTask:
      task: SlimeMainCompound
  - type: TemperatureDamage
    coldDamage:
      types:
        Cold: 10.0

- type: entity
  name: gray xenobiology slime
  id: XenobiologySlimeGray
  parent: XenobiologySlimeBase
  components:
  - type: Slime
    extract: GraySlimeExtract
  - type: SlimeLifecycle
    adultPrototype: XenobiologySlimeGray
    babyPrototype: XenobiologySlimeGrayBaby
    mutationChance: 0.25
    mutations:
    - target: XenobiologySlimeOrange
      weight: 1
      conditions:
      - !type:SatiationCondition
        satiationType: Hunger
        min: 140
    - target: XenobiologySlimePurple
      weight: 1
      conditions:
      - !type:SatiationCondition
        satiationType: Hunger
        max: 140
    - target: XenobiologySlimeBlue
      weight: 1
      conditions:
      - !type:TemperatureCondition
        max: 290
    - target: XenobiologySlimeMetal
      weight: 1
      conditions:
      - !type:TemperatureCondition
        min: 310
  - type: Sprite
    sprite: _RedStar/Mobs/XenoSlimes/gray.rsi
    layers:
    - state: adult

