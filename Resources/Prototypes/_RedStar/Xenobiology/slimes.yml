- type: entity
  name: gray slime
  id: MobAdultSlimesGray
  parent: MobAdultSlimes
  components:
  - type: Butcherable
    spawned:
    - id: GraySlimeExtract
      amount: 1
  - type: SlimeMutation
    mutationChance: 0.25
    mutations:
    - target: MobBabySlimesOrange
      weight: 1
      conditions:
      - !type:SatiationCondition
        satiationType: Hunger
        min: 140
    - target: MobBabySlimesPurple
      weight: 1
      conditions:
      - !type:SatiationCondition
        satiationType: Hunger
        max: 140
    - target: MobBabySlimesBlue
      weight: 1
      conditions:
      - !type:TemperatureCondition
        max: 290
    - target: MobBabySlimesMetal
      weight: 1
      conditions:
      - !type:TemperatureCondition
        min: 310
  - type: Reproductive
    offspring:
    - id: MobBabySlimesGray
      amount: 2
  - type: Sprite
    sprite: _RedStar/Mobs/XenoSlimes/gray.rsi

