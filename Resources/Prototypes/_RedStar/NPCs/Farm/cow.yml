- type: entity
  name: chocolate cow
  parent: MobCow
  id: MobCowChocolate
  description: Moo.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: cow
      sprite: _Funkystation/Mobs/Animals/chocolate_cow.rsi
  - type: SolutionManager
    solutions:
    - SolutionUdderChocolate
  - type: Butcherable
    spawned:
    - id: FoodSnackChocolateBar
      amount: 5

