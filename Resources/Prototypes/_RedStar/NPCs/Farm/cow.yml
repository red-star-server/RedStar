- type: entity
  parent: MobCow
  id: MobCowChocolate
  name: chocolate cow
  description: Moo.
  components:
  - type: Butcherable
    spawned:
    - id: FoodSnackChocolateBar
      amount: 5
  - type: SolutionManager
    solutions:
    - SolutionUdderChocolate
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
      sprite: _RedStar/Mobs/Animals/Farm/chocolate_cow.rsi

- type: entity
  parent: SolutionLarge
  id: SolutionUdderChocolate
  categories: [ HideSpawnMenu ]
  components:
  - type: SatiationProduction
    producer: Parent
    delay: 30
    minimumSatiationThreshold: Peckish
  - type: Solution
    id: udder # TODO This should really use a different id...
    solution:
      reagents:
      - ReagentId: MilkChocolate
        Quantity: 30
  # TODO: toxins from bloodstream !?
  - type: SolutionProducer
    generated:
      reagents:
      - ReagentId: MilkChocolate
        Quantity: 25

