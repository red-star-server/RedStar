- type: entity
  abstract: true
  id: BaseVeinBlueSpaceCrystal
  suffix: Bluespace crystal
  description: An ore vein rich with bluespace crystal.
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreBlueSpaceCrystal
  - type: Sprite
    layers:
    - state: rock_bluespace_crystal
      sprite: _RedStar/Structures/Walls/stone-ore.rsi
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

- type: entity
  parent: [ BaseVeinBlueSpaceCrystal, AsteroidRock ]
  id: AsteroidRockBlueSpaceCrystal

- type: entity
  parent: [ BaseVeinBlueSpaceCrystal, IronRock ]
  id: IronRockBlueSpaceCrystal

- type: entity
  parent: [ BaseVeinBlueSpaceCrystal, WallRockSnow ]
  id: WallRockSnowBlueSpaceCrystal

- type: entity
  parent: [ BaseVeinBlueSpaceCrystal, WallRockSand ]
  id: WallRockSandBlueSpaceCrystal

- type: entity
  parent: [ BaseVeinBlueSpaceCrystal, WallRockChromite ]
  id: WallRockChromiteBlueSpaceCrystal

- type: entity
  parent: [ BaseVeinBlueSpaceCrystal, WallRock ]
  id: WallRockBlueSpaceCrystal
  components:
  - type: EntityRemap
    mask:
      AsteroidRock: AsteroidRockBlueSpaceCrystal
      WallRockChromite: WallRockChromiteBlueSpaceCrystal
      WallRockSand: WallRockSandBlueSpaceCrystal
      WallRockSnow: WallRockSnowBlueSpaceCrystal

