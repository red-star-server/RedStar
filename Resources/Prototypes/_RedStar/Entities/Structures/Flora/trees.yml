- type: entity
  parent: BaseTree
  id: FloraPalmTree01
  name: palm tree
  description: A tropical palm tree. Gives the atmosphere of a paradise island.
  components:
  - type: Sprite
    sprite: _RedStar/Structures/Flora/flora_treepalm.rsi
    state: treepalm01

- type: entity
  parent: FloraPalmTree01
  id: FloraPalmTree02
  components:
  - type: Sprite
    state: treepalm02

- type: entity
  parent: FloraPalmTree01
  id: FloraPalmTree03
  components:
  - type: Sprite
    state: treepalm03

- type: entity
  parent: BaseTree
  id: Sakura
  name: sakura tree
  description: A blossoming cherry tree. Looking at it settles your mind and reminds you of younger years.
  components:
  - type: Sprite
    sprite: _RedStar/Structures/Flora/sakura.rsi
    state: sakuratree
    offset: 0,0.7
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/tree_fell.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          Log:
            min: 2
            max: 8
          FoodSakuraFlower:
            min: 2
            max: 3
