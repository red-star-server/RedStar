- type: entity
  abstract: true
  parent: [ BaseStructure, StructureHealthFurnitureStrong ]
  id: FireplaceBase
  components:
  - type: Appearance
  - type: AmbientSound
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: PointLight
    radius: 3
    energy: 3
    color: '#FF6F00'
  - type: Damageable
    damageModifierSet: SteelStaticMod
  - type: AlwaysHot

- type: entity
  parent: FireplaceBase
  id: FireplaceWhite
  name: white fireplace
  description: An elegant white fireplace that fills the room with warmth.
  components:
  - type: Sprite
    sprite: _RedStar/Structures/Decoration/fireplace.rsi
    layers:
    - state: fireplace
    - state: fire
      shader: unshaded
    - state: glow
      shader: unshaded
  - type: Construction
    graph: Fireplace
    node: fireplaceWhite

- type: entity
  parent: FireplaceBase
  id: FireplaceWooden
  name: wooden fireplace
  description: An elegant wooden fireplace that fills the room with warmth.
  components:
  - type: Sprite
    sprite: _RedStar/Structures/Decoration/fireplace.rsi
    layers:
    - state: fireplace_wooden
    - state: fire_wooden
      shader: unshaded
    - state: glow_wooden
      shader: unshaded
  - type: Construction
    graph: Fireplace
    node: fireplaceWooden
