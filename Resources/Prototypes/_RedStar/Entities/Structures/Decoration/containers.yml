- type: entity
  abstract: true
  id: BaseShippingContainer
  placement:
    mode: SnapgridCenter
  components:
  - type: SpriteFade
  - type: Clickable
  - type: Sprite
    sprite: _RedStar/Objects/Decoration/containers.rsi
    netsync: false
    drawdepth: Overdoors
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-1,1.5,0"
        density: 1000
        layer:
        - WallLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
          !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel:
            min: 10
            max: 20
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseShippingContainer
  id: ShippingContainerBlank
  name: shipping container
  description: A standard-measure shipping container for bulk transport of goods. This one is blank, offering no clue as to its contents.
  components:
  - type: Sprite
    state: blank

- type: entity
  parent: BaseShippingContainer
  id: ShippingContainerConarex
  name: Conarex Aeronautics shipping container
  description: A standard-measure shipping container for bulk transport of goods. This one is from Conarex Aeronautics, and is probably carrying spacecraft parts (or a bribery scandal) as a result.
  components:
  - type: Sprite
    state: conarex

