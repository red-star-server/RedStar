# Chapel (Shrine) Pew

- type: entity
  abstract: true
  parent: [ ChairBase, StructureHealthFurniture ]
  id: PewBase
  name: Pew Base
  components:
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 1
  - type: Tag
    tags:
    - Wooden
  - type: StaticPrice
    price: 250

- type: entity
  parent: PewBase
  id: PewEndLeft
  name: Wood Pew
  suffix: End Left
  components:
  - type: Sprite
    sprite: _RedStar/Structures/Furniture/Benches/pew_end_left.rsi
    state: base
  - type: Construction
    graph: BenchSL
    node: pewLeft

- type: entity
  parent: PewBase
  id: PewEndRight
  name: Wood Pew
  suffix: End Right
  components:
  - type: Sprite
    sprite: _RedStar/Structures/Furniture/Benches/pew_end_right.rsi
    state: base
  - type: Construction
    graph: BenchSL
    node: pewRight

- type: entity
  parent: PewBase
  id: PewMiddle
  name: Wood Pew
  suffix: Middle
  components:
  - type: Sprite
    sprite: _RedStar/Structures/Furniture/Benches/pew_middle.rsi
    state: base
  - type: Construction
    graph: BenchSL
    node: pewMid

