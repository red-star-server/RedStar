- type: entity
  abstract: true
  parent: BaseRailing
  id: BasePlatform
  name: platform
  description: Basic platform meant to protect idiots like you from falling.
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: RCDDeconstructable
    cost: 20
    delay: 2
    fx: EffectRCDDeconstruct2

- type: entity
  parent: BasePlatform
  id: Platform
  components:
  - type: Sprite
    sprite: _RedStar/Structures/Platforms/platform.rsi
    state: side
  - type: Icon
    sprite: _RedStar/Structures/Platforms/platform.rsi
    state: side
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.25"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Construction
    node: railing

