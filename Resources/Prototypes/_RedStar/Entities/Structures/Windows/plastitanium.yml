- type: entity
  parent: [ PlastitaniumWindowSquareBase, BaseTitaniumWindowHealth ]
  id: TitaniumWindow
  name: titanium window
  components:
  - type: Construction
    graph: Window
    node: titaniumWindow
  - type: Sprite
    sprite: _RedStar/Structures/Windows/window-titanium.rsi
  - type: Icon
    sprite: _RedStar/Structures/Windows/window-titanium.rsi
    state: full
  - type: IconSmooth
    key: windows
    states:
    - !type:CornerSpriteSmoothing
      mask:
      - walls
      - windows
      - windows-reinf
      - windows-tinted
      - windows-plasma
      - windows-plasma-reinf
      - windows-uranium
      - windows-uranium-reinf
      - windows-exo
      - windows-shuttle
      - windows-plastitanium
      - windows-regal
      - walls-exo
      - walls-shuttle
      - walls-plastitanium
      - walls-marble
      - grilles
      - doors
      base: window

- type: entity
  parent: [ PlastitaniumWindowDiagonalBase, BaseTitaniumWindowHealth ]
  id: TitaniumWindowDiagonalPlain
  name: titanium window
  components:
  - type: Construction
    graph: WindowDiagonal
    node: titaniumWindowDiagonal
  - type: Sprite
    sprite: _RedStar/Structures/Windows/window-diagonal-titanium.rsi
  - type: Icon
    sprite: _RedStar/Structures/Windows/window-diagonal-titanium.rsi
    state: state0
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi
