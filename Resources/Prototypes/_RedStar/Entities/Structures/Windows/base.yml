- type: entity
  abstract: true
  parent: StructureHealthBarrier
  id: BaseTitaniumWindowHealth
  components:
  - type: Damageable
    damageModifierSet: PlastitaniumMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassTitanium:
            min: 1
            max: 2
  - type: DamageVisuals
    thresholds: [ 5, 10, 20 ]
    damageDivisor: 20
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 3
