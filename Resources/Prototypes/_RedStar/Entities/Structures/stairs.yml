- type: entity
  parent: Stairs
  id: SteelDarkCenterStairs
  name: stairs
  suffix: Steel , center
  description: The greatest invention since rocket-propelled grenades.
  components:
  - type: Sprite
    sprite: _RedStar/Structures/stairs.rsi
    state: steel_dark_center_stairs
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepTile
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts:
        - Destruction

