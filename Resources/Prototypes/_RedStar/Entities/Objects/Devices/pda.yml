# Medical

- type: entity
  parent: BaseMedicalPDA
  id: GeneticistPDA
  name: geneticist PDA
  description: I hope I don’t get it stained with blood.
  components:
  - type: Pda
    id: GeneticistIDCard
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-internmed
  - type: PdaBorderColor
    borderColor: "#717059"
    accentVColor: "#447987"
  - type: Icon
    state: pda-internmed
  - type: GuideHelp
    guides:  
    - MedicalDoctor #TODO make a guide for geneticist

- type: entity
  parent: BaseMedicalPDA
  id: SurgeonPDA
  name: surgeon PDA
  description: Smells faintly of antiseptic.
  components:
  - type: Pda
    id: SurgeonIDCard
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-surgeon
  - type: Sprite
    sprite: Objects/Devices/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      sprite: _RedStar/Objects/Devices/pda.rsi
      state: pda-surgeon
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: unshaded
      visible: false
    - state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: unshaded
      visible: false
  - type: PdaBorderColor
    borderColor: "#d7d7d0"
    accentVColor: "#447987"
  - type: Icon
    sprite: _RedStar/Objects/Devices/pda.rsi
    state: pda-surgeon
  - type: GuideHelp
    guides:
    - Surgery
