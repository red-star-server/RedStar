- type: entity
  parent: [ BaseStructure, StructureHealthFurnitureWeak ]
  id: SpiderCocoon
  name: cocoon
  description: A large cocoon covered in thick webbing.
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/slash.ogg"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 190
        mask:
        - HighImpassable
  - type: Damageable
    damageModifierSet: ThreadMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWebSilk:
            min: 1
            max: 3
  - type: Sprite
    sprite: _RedStar/Objects/Decoration/cocoon.rsi
    layers:
    - state: cocoon_large1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        cocoon_large1: ""
        cocoon_large2: ""
        cocoon_large3: ""
        cocoon1: ""
        cocoon2: ""
        cocoon3: ""
