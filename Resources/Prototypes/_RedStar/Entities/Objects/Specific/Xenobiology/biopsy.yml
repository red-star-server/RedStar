- type: entity
  parent: BaseItem
  id: BiopsyTool
  name: biopsy tool
  description: Used to retrieve biological samples from organisms. Don't worry, it won't sting.
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SampleCollectorVisuals.State:
        enum.SampleCollectorVisuals.Layer:
          True:
            state: icon
          False:
            state: icon-full
  - type: Sprite
    sprite: _RedStar/Objects/Specific/Xenobiology/biopsy_tool.rsi
    layers:
    - map: [ "enum.SampleCollectorVisuals.Layer" ]
      state: icon
  - type: Item
    sprite: _RedStar/Objects/Specific/Xenobiology/biopsy_tool.rsi
  - type: SampleCollector
    damage:
      types:
        Blunt: 2
        Bloodloss: 5
        Cellular: 10
  - type: SampleContainer
    maxSamples: 1
    allowTransfer: false
    allowCollection: false
