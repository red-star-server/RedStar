- type: entity
  parent: BaseItem
  id: GeneticVial
  name: genetic vial
  description: Holds extracted genetic material.
  components:
  - type: GeneticVial
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GeneticVialVisuals.Filled:
        enum.GeneticVialVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: Sprite
    sprite: _RedStar/Objects/Specific/Xenobiology/gene_vial.rsi
    layers:
    - state: vial
    - state: vial_load
      map: [ "enum.GeneticVialVisuals.Layer" ]
      visible: false
  - type: Item
    size: Small
    sprite: _RedStar/Objects/Specific/Xenobiology/gene_vial.rsi
