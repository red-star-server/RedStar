# Base
- type: entity
  abstract: true
  parent: Paper
  id: PaperPrintedBase
  name: printed document
  description: A sheet of paper with a formatted header.
  components:
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 6.0, 6.0, 6.0, 6.0

