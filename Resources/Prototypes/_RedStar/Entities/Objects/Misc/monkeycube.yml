- type: entity
  parent: BaseWrappedCube
  id: SkrellkeyCubeWrapped
  name: neara cube
  description: Unwrap this to get a neara cube.
  components:
  - type: SpawnItemsOnUse
    items:
    - id: SkrellkeyCube
  - type: Sprite
    state: wrapper

