- type: entity
  parent: MonkeyCubeBox
  id: SkrellkeyCubeBox
  name: neara cube box
  description: Condensed nearas in a cube. Just add water!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: SkrellkeyCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

