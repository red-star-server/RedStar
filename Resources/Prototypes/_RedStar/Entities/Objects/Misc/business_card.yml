# Valentine
- type: entity
  id: ValentineCard
  parent: Paper
  name: valentine card
  description: The template for this Valentine's card was developed by the Ministry of Labor and Social Protection. It is said that these Valentine's cards can help overcome the demographic crisis.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: valentine_card
    - state: valentine_card
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    headerImagePath: "/Textures/_RedStar/Interface/Paper/paper_heading_valentine_heart.svg.96dpi.png"
    headerMargin: 0.0, 0.0, 0.0, 2.0
    backgroundImagePath: "/Textures/_RedStar/Interface/Paper/paper_background_pink.svg.96dpi.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 4.0, 4.0, 4.0, 4.0
    maxWritableArea: 400.0, 256.0
