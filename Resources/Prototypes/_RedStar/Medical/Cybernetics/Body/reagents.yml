- type: reagent
  id: Microplastics
  name: reagent-name-microplastics
  group: Toxins
  desc: reagent-desc-microplastics
  physicalDesc: reagent-physical-desc-powdery
  color: '#ffffff'
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 2
  - !type:PlantAdjustHealth
    amount: -1
  metabolisms:
    Digestion:
      metabolites:
        Microplastics: 1
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: -0.15
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox
    Bloodstream:
      metabolismRate: 0.01
      effects:
      - !type:HealthChange
        probability: 0.5
        damage:
          types:
            Poison: 0.25
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox
          inverted: true
      - !type:Vomit
        probability: 0.1
        conditions:
        - !type:ReagentCondition
          reagent: Microplastics
          min: 10
        - !type:MetabolizerTypeCondition
          type:
          - Vox
          inverted: true
      - !type:ModifyStatusEffect
        effectProto: MicroplasticsStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Microplastics
          min: 20
        - !type:MetabolizerTypeCondition
          type:
          - Vox
          inverted: true

- type: reagent
  id: LabGrownNutriment
  name: reagent-name-lab-grown-nutriment
  group: Foods
  desc: reagent-desc-lab-grown-nutriment
  physicalDesc: reagent-physical-desc-opaque
  flavor: nutriment
  color: '#1f0a0a'
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 1.5
  - !type:PlantAdjustHealth
    amount: -0.75
  metabolisms:
    Digestion:
      metabolismRate: 0.01
      metabolites:
        LabGrownNutriment: 1
      effects:
      - !type:Satiate
        satiationType: Hunger
        factor: 0.015
    Bloodstream:
      metabolismRate: 0.01
      effects:
      - !type:PopupMessage
        type: Local
        messages:
        - reagent-popup-lab-grown-nutriment
        probability: 0.05
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox
          - Slime
          inverted: true

- type: entity
  parent: StatusEffectSlowdown
  id: MicroplasticsStatusEffect
  name: microplastics buildup
  components:
  - type: MovementModStatusEffect
    sprintSpeedModifier: 0.9
    walkSpeedModifier: 0.9
