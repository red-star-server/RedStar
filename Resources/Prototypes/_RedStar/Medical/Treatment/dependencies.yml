- type: reagent
  id: Aluite
  name: reagent-name-aluite
  group: Toxins
  desc: reagent-desc-aluite
  physicalDesc: reagent-physical-desc-bubbly
  flavor: bitter
  color: "#8e8e8e"
  metabolisms:
    Bloodstream:
      metabolismRate: 3
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Aluite
          min: 6
        damage:
          types:
            Blunt: 10
      - !type:AdjustReagent
        amount: -25
        reagent: ProcenylLazide
      - !type:AdjustReagent
        amount: -25
        reagent: Aluite

- type: reagent
  id: Sarin
  name: reagent-name-sarin
  group: Toxins
  desc: reagent-desc-sarin
  physicalDesc: reagent-physical-desc-powdery
  flavor: salty
  color: "#ff8239"
  boilingPoint: 255.0
  meltingPoint: 36.0
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 2
      - !type:ModifyStatusEffect
        effectProto: SarinSlowdownStatusEffect
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
      - !type:Jitter ''
      - !type:ModifyParalysis
        probability: 0.5
        time: 4
        conditions:
        - !type:ReagentCondition
          reagent: Sarin
          min: 5
      - !type:PopupMessage
        type: Local
        probability: 0.08
        messages:
        - generic-reagent-effect-burning-eyes
        - generic-reagent-effect-burning-eyes-a-bit
        - generic-reagent-effect-tearing-up
        - norepinephricacid-effect-eyelids
        - norepinephricacid-effect-eyes-itch
        - norepinephricacid-effect-vision-fade
        - norepinephricacid-effect-vision-fail
      - !type:PopupMessage
        type: Local
        visualType: MediumCaution
        probability: 0.03
        messages:
        - norepinephricacid-effect-eye-disconnect
        - norepinephricacid-effect-eye-pain
        - norepinephricacid-effect-darkness
        - norepinephricacid-effect-blindness
        conditions:
        - !type:ReagentCondition
          reagent: Sarin
          min: 5
      - !type:Emote
        emote: Scream
        probability: 0.08
      - !type:ModifyStatusEffect
        effectProto: StatusEffectBlindness
        conditions:
        - !type:ReagentCondition
          reagent: Sarin
          min: 2.5
  reactiveEffects:
    Acidic:
      methods:
      - Touch
      effects:
      - !type:HealthChange
        scaling: true
        ignoreResistances: false
        damage:
          types:
            Caustic: 3
        conditions:
        - !type:NestedCondition
          proto: NoPressureProtection

