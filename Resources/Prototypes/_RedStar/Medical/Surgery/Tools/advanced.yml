    state: adv-retractor-on
  - type: Item
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/adv-retractor.rsi
    heldPrefix: retractor
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 12
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 150
      Glass: 37
      Silver: 37
  - type: MultipleTool
    statusShowBehavior: true
    entries:
    - behavior: [ Retracting ]
      sprite: { sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/adv-retractor.rsi, state: adv-retractor }
      useSound: /Audio/_RedStar/Medical/Surgery/retractor1.ogg
      changeSound: { path: /Audio/Effects/sparks4.ogg }
    - behavior: [ Clamping, Manipulating, Tending ]
      sprite: { sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/adv-retractor.rsi, state: adv-retractor-on }
      useSound: /Audio/_RedStar/Medical/Surgery/hemostat1.ogg
      changeSound: { path: /Audio/Effects/sparks4.ogg }
  - type: Tool
    qualities:
      - Retracting
    speedModifier: 3
    useSound: /Audio/_RedStar/Medical/Surgery/retractor1.ogg
