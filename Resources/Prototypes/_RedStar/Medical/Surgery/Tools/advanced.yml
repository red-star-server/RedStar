- type: entity
  parent: BaseToolSurgery
  id: Bonesetter
  name: bone setter
  description: Used for setting bones back into place.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/bonesetter.rsi
    state: bonesetter
  - type: Item
  - type: Tool
    qualities:
      - BoneSetting
    useSound: /Audio/_RedStar/Medical/Surgery/bone_setter.ogg
- type: entity
  parent: BaseToolSurgery
  id: BoneGel
  name: bottle of bone gel
  description: A container for bone gel that often needs to be refilled from a specialized machine.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/bone-gel.rsi
    state: bone-gel
  - type: Tool
    qualities:
      - BoneHealing
- type: entity
  parent: BaseToolSurgery
  id: MedicalStitches
  name: medical stitches
  description: A fine, curved needle with a length of absorbable polyglycolide suture thread.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/stitches.rsi
    state: stitches
  - type: Tool
    qualities:
      - Suturing
    useSound: /Audio/_RedStar/Medical/Surgery/saw.ogg # TODO: SOUND
- type: entity
  parent: Scalpel
  id: EnergyScalpel
  name: tissue cutter
  description: A scalpel which uses an energy blade, also serves as a drill in its powered state.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/e-scalpel.rsi
    state: e-scalpel-on
  - type: Item
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/e-scalpel.rsi
    heldPrefix: scalpel
  - type: MeleeWeapon
    damage:
      types:
        Slash: 12
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 150
      Glass: 37
      Gold: 37
  - type: MultipleTool
    statusShowBehavior: true
    entries:
    - behavior: [ Slicing, Sawing ]
      sprite: { sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/e-scalpel.rsi, state: e-scalpel }
      useSound: /Audio/_RedStar/Medical/Surgery/scalpel1.ogg
      changeSound: { path: /Audio/Effects/sparks4.ogg }
    - behavior: [ Drilling ]
      sprite: { sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/e-scalpel.rsi, state: e-scalpel-on }
      useSound: /Audio/_RedStar/Medical/Surgery/saw.ogg
      changeSound: { path: /Audio/Effects/sparks4.ogg }
  - type: Tool
    qualities:
      - Slicing
      - Sawing
    speedModifier: 3
    useSound: /Audio/_RedStar/Medical/Surgery/scalpel1.ogg
- type: entity
  parent: Retractor
  id: AdvancedRetractor
