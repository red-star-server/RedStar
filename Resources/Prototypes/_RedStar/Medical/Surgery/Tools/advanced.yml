- type: entity
  parent: BaseToolSurgery
  id: OmnimedTool
  name: surgical omnitool
  description: A compact surgical omnitool conveniently packed like a Swiss Army knife.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/omnimed.rsi
    state: omnimed
  - type: Item
    size: Normal
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/omnimed.rsi
  - type: Tool
    qualities:
      - Slicing
      - Sawing
      - Cauterizing
      - Drilling
      - Retracting
      - Clamping
      - Suturing
      - BoneHealing
      - BoneSetting
      - Tending
      - Manipulating
    useSound: /Audio/_RedStar/Medical/Surgery/saw.ogg
- type: entity
  parent: [ OmnimedTool, BaseSyndicateContraband ]
  id: OmnimedToolSyndie
  name: gorlex surgical omnitool
  description: A compact surgical omnitool conveniently packed like a Swiss Army knife, except that its user has probably violated a couple of Swiss conventions. Can perform surgery through clothing.
  components:
  - type: Sprite
    state: evil
  - type: Item
    size: Small
    heldPrefix: evil
  - type: SurgeryIgnoreClothing

- type: entity
  parent: OmnimedToolSyndie
  id: OmnimedToolDebug
  name: experimental surgical omnitool
  suffix: Admeme
  components:
  - type: Tool
    qualities:
      - Slicing
      - Sawing
      - Cauterizing
      - Drilling
      - Retracting
      - Clamping
      - Suturing
      - BoneHealing
      - BoneSetting
      - Tending
      - Manipulating
    speedModifier: 10
