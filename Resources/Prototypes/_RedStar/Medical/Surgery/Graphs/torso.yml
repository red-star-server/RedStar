        inverted: true
      steps:
      - name: Insert part
        organ: ArmLeft
        duration: 6
        effects:
        - !type:InsertPartEffect
          category: ArmLeft
      - name: Seal wounds
        quality: Cauterizing
        duration: 2
        effects:
        - !type:AffixPartEffect
          category: ArmLeft
        - !type:DamageEffect
