        organ: Wings
        duration: 6
        effects:
        - !type:InsertPartEffect
          category: Wings
      - name: Seal wounds
        quality: Cauterizing
        duration: 2
        effects:
        - !type:AffixPartEffect
          category: Wings
        - !type:DamageEffect
          sleepModifier: 2
          damage:
            types:
              Heat: -5
    - id: OpenTailSlot
      target: Incised
      label: surgery-edge-create-tail-joint
      conditions:
      - !type:OrganSlotCondition
        organSlot: Tail
        inverted: true
      - !type:BodyComponentCondition
        blacklist:
          components:
          - Silicon
      steps:
      - name: Saw through bones
        quality: Sawing
        duration: 4
      - name: Create joint
        quality: BoneHealing
        duration: 2
      - name: Stitch joint blood vessels
        quality: Suturing
        duration: 5
      - name: Carve out a cavity
        quality: Slicing
        duration: 6
        effects:
        - !type:AddOrganSlotEffect
          organSlot: Tail
    - id: OpenWingsSlot
      target: Incised
      label: surgery-edge-create-wing-joints
      conditions:
      - !type:OrganSlotCondition
        organSlot: Wings
