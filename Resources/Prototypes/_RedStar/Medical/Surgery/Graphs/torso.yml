        quality: Sawing
        duration: 4
      - name: Create joint
        quality: BoneHealing
        duration: 2
      - name: Stitch joint blood vessels
        quality: Suturing
        duration: 5
      - name: Carve out a cavity
        quality: Slicing
        duration: 6
        effects:
        - !type:AddOrganSlotEffect
