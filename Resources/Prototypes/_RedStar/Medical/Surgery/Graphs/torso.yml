- type: surgeryGraph
  id: SurgeryGraphTorso
  name: Torso surgery
  startNode: Closed
  nodes:
  - name: Closed
    label: Closed
    edges:
    - id: OpenIncision
      target: Incised
      label: surgery-edge-open-incision
      conditions:
      - !type:PartTypeCondition
        parts: [Torso]
      - !type:PartPresentCondition
      - !type:PartComponentCondition
        inverted: true
        components:
        - type: XenoBodyPart
      steps:
      - name: Cut with a scalpel
        quality: Slicing
        duration: 2
        effects:
        - !type:DamageEffect
          sleepModifier: 0.5
          damage:
            types:
              Bloodloss: 10
      - name: Retract the skin
        quality: Retracting
        duration: 2
  - name: Incised
    label: Incision open
    # TODO: сделать спрайт разреза на груди (сейчас заглушка из bleeding_damage)
    overlay:
      rsi: _RedStar/Medical/Mobs/Effects/bleeding_damage.rsi
      stateSuffix: Minor
    packages:
    - SurgeryTendWounds
    - SurgeryTissueIncised
    edges:
    - id: CloseIncision
      target: Closed
      label: surgery-edge-close-incision
      steps:
      - name: Close incision
        quality: Cauterizing
        duration: 2
        effects:
        - !type:DamageEffect
          sleepModifier: 2
          damage:
            types:
              Heat: -5
        - !type:ComponentEffect
          remove:
          - type: OrganReattached
    - id: OpenBones
      target: BonesOpen
      label: surgery-edge-open-ribcage
      steps:
      - name: Saw through bones
        quality: Sawing
        duration: 4
      - name: Prise the bones open
        quality: Retracting
        duration: 2
    - id: AttachHead
      target: Closed
      label: surgery-edge-attach-head
      conditions:
      - !type:PartRemovedCondition
        category: Head
      - !type:TraumaPresentCondition
        trauma: Dismemberment
        inverted: true
      steps:
      - name: Insert part
        organ: Head
        duration: 6
        effects:
        - !type:InsertPartEffect
          category: Head
      - name: Seal wounds
        quality: Cauterizing
        duration: 2
        effects:
        - !type:AffixPartEffect
          category: Head
        - !type:DamageEffect
          sleepModifier: 2
          damage:
            types:
              Heat: -5
    - id: AttachLeftArm
      target: Closed
      label: surgery-edge-attach-left-arm
      conditions:
      - !type:PartRemovedCondition
        category: ArmLeft
      - !type:TraumaPresentCondition
