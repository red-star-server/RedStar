- type: surgeryProcedure
  id: InsertCavityItem
  name: surgery-procedure-insert-cavity-item
  from: [RibcageOpen]
  conditions:
  - !type:PartTypeCondition
    parts: [Torso]
  steps:
  - name: surgery-step-insert-item
    anyItem: true
    requireHeldItem: true
    duration: 4
    effects:
    - !type:CavityEffect

- type: surgeryProcedure
  id: RemoveCavityItem
  name: surgery-procedure-remove-cavity-item
  from: [RibcageOpen]
  conditions:
  - !type:PartTypeCondition
    parts: [Torso]
  steps:
  - name: surgery-step-remove-item
    anyItem: true
    duration: 4
    effects:
    - !type:CavityEffect
      remove: true

- type: surgeryProcedure
  id: CreateTailSlot
  name: surgery-procedure-create-tail-slot
  from: [Incised]
  conditions:
  - !type:PartTypeCondition
    parts: [Torso]
  - !type:OrganSlotCondition
    organSlot: Tail
    inverted: true
  - !type:BodyComponentCondition
    blacklist:
      components:
      - Silicon
  steps:
  - name: surgery-step-saw-bones
    quality: Sawing
    duration: 4
  - name: surgery-step-create-joint
    quality: BoneHealing
    duration: 2
  - name: surgery-step-stitch-joint
    quality: Suturing
    duration: 5
  - name: surgery-step-carve-cavity
    quality: Slicing
    icon:
      sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/scalpel.rsi
      state: scalpel
    duration: 6
    effects:
    - !type:AddOrganSlotEffect
      organSlot: Tail

