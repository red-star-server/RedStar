- type: entity
  abstract: true
  id: SurgeryStepBase
  components:
  - type: SurgeryStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenIncisionScalpel
  name: Cut with a scalpel
  components:
  - type: SurgeryStep
    toolQualities:
    - Slicing
    setFlags:
    - IncisionOpen
    duration: 2
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Bloodloss: 10
    sleepModifier: 0.5

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampBleeders
  name: Clamp the bleeders
  components:
  - type: SurgeryStep
    toolQualities:
    - Clamping
    setFlags:
    - BleedersClamped
    duration: 4
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryRepeatableStep
  - type: SurgeryBleedsTreatmentStep
    amount: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseBloodOutputs
  name: Stitch up destroyed tissues
  components:
  - type: SurgeryStep
    toolQualities:
    - Suturing
    clearFlags:
    - BleedersClamped
    duration: 5
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/stitches.rsi
    state: stitches

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractSkin
  name: Retract the skin
  components:
  - type: SurgeryStep
    toolQualities:
    - Retracting
    setFlags:
    - SkinRetracted
    duration: 2
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveSeveredSkin
  name: Remove the dead skin
  components:
  - type: SurgeryStep
    toolQualities:
    - Slicing
    setFlags:
    - BodyPartSawed
    duration: 4
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawBones
  name: Saw through bones
  components:
  - type: SurgeryStep
    toolQualities:
    - Sawing
    setFlags:
    - BonesSawed
    duration: 4
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveLeftoverBones
  name: Clear up bone leftovers
  components:
  - type: SurgeryStep
    toolQualities:
    - Sawing
    setFlags:
    - BonesOpen
    duration: 5
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendBones
  name: Mend bones
  components:
  - type: SurgeryStep
    toolQualities:
    - BoneHealing
    duration: 7
  - type: SurgeryAffixPartStep
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/bone-gel.rsi
    state: bone-gel
  - type: SurgeryRepeatableStep
  - type: SurgeryTraumaTreatmentStep
    traumaType: BoneDamage
    amount: 17

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepHealOrgans
  name: Heal Organs
  components:
  - type: SurgeryStep
    toolQualities:
    - Tending
    duration: 7
  - type: SurgeryAffixOrganStep
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryRepeatableStep
  - type: SurgeryTraumaTreatmentStep
    traumaType: OrganDamage
    amount: 17

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPriseOpenBones
  name: Prise the bones open
  components:
  - type: SurgeryStep
    toolQualities:
    - Retracting
    setFlags:
    - BonesOpen
    duration: 2
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor

