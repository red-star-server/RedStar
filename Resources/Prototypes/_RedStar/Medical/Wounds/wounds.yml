- type: entity
  abstract: true
  id: WoundBase
  components:
  - type: Wound
    damageType: Blunt
  - type: ContainerContainer
    containers:
      Traumas: !type:Container
        ents: []

- type: entity
  parent: WoundBase
  id: WoundBlunt
  components:
  - type: Wound
    damageType: Blunt
    scarWound: BluntScar
    mangleSeverity: Severe
    textString: Blunt
  - type: TraumaInflicter
    severityThreshold: 12
    allowedTraumas:
    - Dismemberment
    - OrganDamage
    - BoneDamage
    - VeinsDamage
    allowArmourDeduction:
    - Dismemberment
    - OrganDamage
    - BoneDamage
    - VeinsDamage
    traumasChances:
      Dismemberment: -0.3
      OrganDamage: 0.17
      BoneDamage: 0.8
      VeinsDamage: 0
    mangledMultipliers:
      BoneDamage: 1

