- type: constructionGraph
  id: MattressGraph
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity {}
    edges:
    - to: mattress
      completed:
      - !type:SnapToGrid {}
      steps:
      - material: Cloth
        amount: 2
        doAfter: 1
    - to: mattress_clean
      completed:
      - !type:SnapToGrid {}
      steps:
      - material: Cloth
        amount: 2
        doAfter: 1
    - to: mattress_clean_full
      completed:
      - !type:SnapToGrid {}
      steps:
      - material: Cloth
        amount: 4
        doAfter: 1
    - to: mattress_full
      completed:
      - !type:SnapToGrid {}
      steps:
      - material: Cloth
        amount: 4
        doAfter: 1
  - node: mattress
    entity: Mattress
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialCloth1
        amount: 2
      steps:
      - tool: Screwing
        doAfter: 1
  - node: mattress_clean
    entity: MattressClean
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialCloth1
        amount: 2
      steps:
      - tool: Screwing
        doAfter: 1
  - node: mattress_clean_full
    entity: MattressCleanFull
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialCloth1
        amount: 4
      steps:
      - tool: Screwing
        doAfter: 1
  - node: mattress_full
    entity: MattressFull
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialCloth1
        amount: 4
      steps:
      - tool: Screwing
        doAfter: 1
