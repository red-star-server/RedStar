- type: constructionGraph
  id: DeckChairGraph
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity {}
    edges:
    - to: deckChair
      completed:
      - !type:SnapToGrid {}
      steps:
      - material: WoodPlank
        amount: 5
        doAfter: 1
  - node: deckChair
    entity: DeckChair
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
        amount: 5
      steps:
      - tool: Screwing
        doAfter: 1
