- type: entity
  abstract: true
  parent: BaseItem
  id: BaseToolSurgery
  components:
  - type: Sprite
  - type: StaticPrice
    price: 60
  - type: Tag
    tags:
    - SurgeryTool
- type: entity
  parent: BaseToolSurgery
  id: Cautery
  name: cautery
  description: A surgical tool used to cauterize open wounds.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: Item
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/cautery.rsi
    storedRotation: 90
  - type: MeleeWeapon
    damage:
       types:
        Heat: 5
    soundHit:
      path: /Audio/Effects/lightburn.ogg
  - type: Tool
    qualities:
      - Cauterizing
    useSound: /Audio/_RedStar/Medical/Surgery/cautery1.ogg
- type: entity
  parent: [ BaseToolSurgery, BaseMedicalScienceContraband ] # Trauma - Made it contraband
  id: Drill
  name: drill
  description: A surgical drill for making holes into hard material.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/drill.rsi
    state: drill
  - type: Item
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/drill.rsi
    shape:
    - 0,0,1,0
    - 1,1,1,1
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 10
    soundHit:
      path: /Audio/Items/drill_hit.ogg
  - type: StaticPrice
    price: 40
  - type: Tool
    qualities:
      - Drilling
    useSound: /Audio/_RedStar/Medical/Surgery/saw.ogg
- type: entity
  parent: [ BaseToolSurgery, BaseMedicalScienceContraband ] # Trauma - Made it contraband
  id: Scalpel
  name: scalpel
  description: A surgical tool used to make incisions into flesh.
  components:
  - type: Tag
    tags:
    - SurgeryTool
    - Knife
  - type: Tool
    qualities:
      - Slicing
    speedModifier: 0.66 # pretend the sixes go on forever :)
    useSound: /Audio/_RedStar/Medical/Surgery/scalpel1.ogg
  - type: Utensil
    types:
      - Knife
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: Item
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/scalpel.rsi
    storedRotation: 90
  - type: MeleeWeapon
    wideAnimationRotation: 90
    swingLeft: true
    attackRate: 1.5
    damage:
      types:
        Slash: 8
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

- type: entity
  parent: [ Scalpel, BaseMinorContraband] # Trauma - Contraband the prison shiv.
  id: ScalpelShiv
  name: shiv
  description: A pointy piece of glass, abraded to an edge and wrapped in tape for a handle. # Could become a decent tool or weapon with right tool mods.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/LegacyTools/scalpel.rsi
    state: shiv
  - type: Item
    sprite: _RedStar/Medical/LegacyTools/scalpel.rsi
    storedRotation: 90
    heldPrefix: shiv

- type: entity
  parent: Scalpel
  id: ScalpelAdvanced
  name: advanced scalpel
  description: Made of more expensive materials, sharper and generally more reliable.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/LegacyTools/scalpel.rsi
    state: advanced
  - type: Item
    sprite: _RedStar/Medical/LegacyTools/scalpel.rsi
    storedRotation: 90
    heldPrefix: advanced
  - type: MeleeWeapon
    damage:
      types:
        Slash: 12
  - type: Tool
    qualities:
      - Slicing
    speedModifier: 1.35
- type: entity
  parent: Scalpel
  id: ScalpelLaser
  name: laser scalpel
  description: A scalpel which uses a directed laser to slice instead of a blade, for more precise surgery while also cauterizing as it cuts.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/LegacyTools/scalpel.rsi
    state: laser
  - type: Item
    sprite: _RedStar/Medical/LegacyTools/scalpel.rsi
    storedRotation: 90
    heldPrefix: laser
  - type: Tool
    qualities:
      - Slicing
    speedModifier: 1.75
- type: entity
  parent: BaseToolSurgery
  id: Retractor
  name: retractor
  description: A surgical tool used to hold open incisions.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor
  - type: Item
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/retractor.rsi
    storedRotation: 90
  - type: Tool
    qualities:
      - Retracting
    useSound: /Audio/_RedStar/Medical/Surgery/retractor1.ogg
- type: entity
  parent: BaseToolSurgery
  id: Hemostat
  name: hemostat
  description: A surgical tool used to compress blood vessels to prevent bleeding.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: Item
    heldPrefix: hemostat
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/hemostat.rsi
    storedRotation: 90
  - type: Tool
    qualities:
      - Clamping
      - Manipulating
      - Tending
    useSound: /Audio/_RedStar/Medical/Surgery/retractor1.ogg
- type: entity
  parent: [ BaseToolSurgery, BaseMedicalScienceContraband ] # Trauma - Made it contraband
  id: Saw
  name: metal saw
  description: For cutting wood and other objects to pieces. Or sawing bones, in case of emergency.
  components:
  - type: Utensil
    types:
      - Knife
  - type: Sprite
    sprite: _RedStar/Medical/LegacyTools/saw.rsi
    state: saw
  - type: Item
    size: Normal
    sprite: _RedStar/Medical/LegacyTools/saw.rsi
    storedRotation: 90
  - type: Tool
    useSound: # Trauma
      path: /Audio/_RedStar/Medical/Surgery/bone_saw.ogg
    qualities:
      - Sawing
      - Slicing
- type: entity
  parent: [Saw, BaseMinorContraband] # Trauma - add contraband mark
  id: SawImprov
  name: choppa
  description: A wicked serrated blade made of whatever nasty sharp things you could find. # It would make a pretty decent weapon, given there are more space for some tool mods too.
  components:
  - type: Sprite
    state: improv
  - type: Item
    size: Small
    heldPrefix: improv
  - type: MeleeWeapon
    damage:
      types:
        Slash: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tool
    qualities:
      - Sawing
    speedModifier: 0.5
- type: entity
  parent: Saw
  id: SawElectric
  name: circular saw
  description: For heavy duty cutting.
  components:
  - type: Tag
    tags:
    - SurgeryTool
    - CircularSaw
  - type: Sprite
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw
  - type: Item
    size: Normal
    sprite: _RedStar/Medical/Objects/Specific/Medical/Surgery/circular-saw.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15
    soundHit:
      path: /Audio/Items/drill_hit.ogg
  - type: Tool
    qualities:
      - Sawing
    speedModifier: 1.5
    useSound: # Trauma
      path: /Audio/_RedStar/Medical/Surgery/saw.ogg
- type: entity
  parent: [ SawElectric ]
  id: SawAdvanced
  name: advanced circular saw
  description: You think you can cut anything with it.
  components:
  - type: Sprite
    sprite: _RedStar/Medical/LegacyTools/saw.rsi
    state: advanced
  - type: Item
    size: Normal
    sprite: _RedStar/Medical/LegacyTools/saw.rsi
    storedRotation: 90
    heldPrefix: advanced
  - type: MeleeWeapon
    attackRate: 1.5
  - type: Tool
    qualities:
      - Sawing
    speedModifier: 2
