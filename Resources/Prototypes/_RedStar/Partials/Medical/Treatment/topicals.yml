- type: entity
  id: Ointment
  components:
  - type: Healing
    damageContainers: !Clear
    - Biological
    damage: !Clear
      types:
        Heat: -10
        Cold: -10
        Shock: -10
        Caustic: -5
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: Ointment
    count: 15

