- type: reagent
  id: Oxygen
  metabolisms: !Clear
    Bloodstream:
      effects:
      - !type:Oxygenate
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Human
          - Animal
          - Rat
          - Plant
          - Arachnid
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
      - !type:ModifyLungGas
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox
          inverted: true
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        ratios:
          CarbonDioxide: 1.0
          Oxygen: -1.0
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        ignoreResistances: true
        damage:
          types:
            Poison: 1.5
      - !type:AdjustAlert
        alertType: Toxins
        minScale: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        clear: true
        time: 5
      - !type:Oxygenate
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
      - !type:ModifyLungGas
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
        ratios:
          CarbonDioxide: 0.5
          Oxygen: -0.5
    Respiration:
      effects:
      - !type:Oxygenate
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Human
          - Animal
          - Rat
          - Plant
          - Arachnid
          - Moth
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
      - !type:ModifyLungGas
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox
          inverted: true
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        ratios:
          CarbonDioxide: 1.0
          Oxygen: -1.0
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        ignoreResistances: true
        damage:
          types:
            Poison: 0.7
      - !type:AdjustAlert
        alertType: Toxins
        minScale: 0.5
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        clear: true
        time: 5
      - !type:Oxygenate
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
      - !type:ModifyLungGas
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
        ratios:
          CarbonDioxide: 0.5
          Oxygen: -0.5

