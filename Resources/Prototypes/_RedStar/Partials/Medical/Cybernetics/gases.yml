- type: reagent
  id: NitrousOxide
  metabolisms: !Clear
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
      - !type:HealthChange
        damage:
          types:
            Poison: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
    Respiration:
      effects:
      - !type:Emote
        minScale: 0.2
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Slime
          inverted: true
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        emote: Laugh
        probability: 0.1
      - !type:Emote
        minScale: 0.2
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Slime
          inverted: true
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        emote: Scream
        probability: 0.01
      - !type:PopupMessage
        minScale: 0.5
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Slime
          inverted: true
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        type: Local
        visualType: Medium
        messages:
        - effect-sleepy
        probability: 0.1
      - !type:MovementSpeedModifier
        minScale: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Slime
          inverted: true
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        walkSpeedModifier: 0.65
        sprintSpeedModifier: 0.65
      - !type:ModifyStatusEffect
        minScale: 1.8
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Slime
          inverted: true
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        effectProto: StatusEffectForcedSleeping
        time: 3
        type: Update
      - !type:HealthChange
        minScale: 3.5
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Slime
          inverted: true
        - !type:MetabolizerTypeCondition
          type:
          - Cybernetic
          inverted: true
        ignoreResistances: true
        scaling: true
        damage:
          types:
            Poison: 1

