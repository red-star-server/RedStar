- type: gene
  id: EggLayer
  tier: 1
  fragmentCount: 4
  minimumStability: 0.5
  effects:
  - !type:AddComponents
    components:
    - type: EntityProducerAction
      insufficientSatiationPopup: action-popup-lay-egg-too-hungry
      userPopup: action-popup-lay-egg-user
      othersPopup: action-popup-lay-egg-others
    - type: SatiationProduction
      delay: 60
      delayMax: 120
      satiationUsage: 60
      minimumSatiation: 60
      automaticForPlayers: false
    - type: EntityProducer
      table:
        id: FoodEgg
    - type: ActionGrant
      actions:
      - ActionAnimalLayEgg

