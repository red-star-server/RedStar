- type: entity
  parent: StatusEffectBase
  id: GeneExpressionEggLayer
  components:
  - type: GeneExpression
    gene: EggLayer
    components:
    - type: EntityProducerAction
      insufficientSatiationPopup: action-popup-lay-egg-too-hungry
      userPopup: action-popup-lay-egg-user
      othersPopup: action-popup-lay-egg-others
    - type: SatiationProduction
      delay: 60
      delayMax: 120
      satiationUsage: 60
      minimumSatiation: 60
      automaticForPlayers: false
    - type: EntityProducer
      table:
        id: FoodEgg
    actions:
    - ActionAnimalLayEgg

