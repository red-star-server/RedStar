    gene: ParrotSpeech
    components:
    - type: ActiveListener
    - type: ParrotMemory
    - type: ParrotListener
    - type: Vocalizer

- type: entity
  parent: StatusEffectPressureImmunity
  id: GeneExpressionPressureHomeostasis
  components:
  - type: GeneExpression
    gene: PressureHomeostasis

- type: entity
  parent: StatusEffectBase
  id: GeneExpressionRadiation
  components:
  - type: GeneExpression
    gene: Radiation
    components:
    - type: RadiationSource
      intensity: 0.25
      slope: 0.5

- type: entity
  parent: StatusEffectBase
  id: GeneExpressionReflection
  components:
  - type: GeneExpression
    gene: Reflection
    components:
    - type: Reflect
      reflects: Energy
      reflectProb: 0.25

- type: entity
  parent: StatusEffectBase
  id: GeneExpressionInvisibility
  components:
  - type: GeneExpression
    gene: Invisibility
    components:
    - type: Stealth
      enabledOnDeath: false
    - type: StealthOnMove
      passiveVisibilityRate: -0.1
      movementVisibilityRate: 0.5

- type: entity
  parent: StatusEffectBase
  id: GeneExpressionDragonBreath
  components:
  - type: GeneExpression
    gene: DragonBreath
    actions:
