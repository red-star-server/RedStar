- type: gene
  id: BiologicalVariant
  kind: Allele
  alleles: [A, B, C, D]

- type: gene
  id: Pacifism
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: Pacified

- type: gene
  id: OwO
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: OwOAccent

- type: gene
  id: NightVision
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: NightVision

- type: gene
  id: EggLayer
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: EntityProducerAction
      insufficientSatiationPopup: action-popup-lay-egg-too-hungry
      userPopup: action-popup-lay-egg-user
      othersPopup: action-popup-lay-egg-others
    - type: SatiationProduction
      delay: 60
      delayMax: 120
      satiationUsage: 60
      minimumSatiation: 60
      automaticForPlayers: false
    - type: EntityProducer
      table:
        id: FoodEgg
    - type: ActionGrant
      actions:
      - ActionAnimalLayEgg

- type: gene
  id: Lactation
  kind: Presence
  effects:
  - !type:ContainedSolutionEffect
    prototype: SolutionUdder
    solutionName: udder
  - !type:AddComponents
    components:
    - type: HarvestableSolution
      solutionName: udder
      verbText: udder-system-verb-milk
      emptyMessage: udder-system-dry
      successMessage: udder-system-success

- type: gene
  id: Venomous
  kind: Presence
  effects:
  - !type:ContainedSolutionEffect
    prototype: SolutionVenomSpider
    solutionName: melee
  - !type:AddComponents
    components:
    - type: MeleeChemicalInjector
      transferAmount: 1
      solution: melee

- type: gene
  id: WebSpinning
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: Spider

- type: gene
  id: Regeneration
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: PassiveDamage
      interval: 3s
      allowedStates:
      - Alive
      damage:
        types:
          Blunt: -0.25
          Slash: -0.25
          Piercing: -0.25
          Heat: -0.25
          Shock: -0.25
          Cold: -0.25
          Caustic: -0.25

- type: gene
  id: NoSlip
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: NoSlip

- type: gene
  id: Reflection
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: Reflect
      reflectProb: 0.5

- type: gene
  id: Invisibility
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: Stealth
    - type: StealthOnMove

- type: gene
  id: Radiation
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: RadiationSource

- type: gene
  id: Reform
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: Reform
      actionPrototype: DionaReformAction
      reformTime: 10
      popupText: diona-reform-attempt
      reformPrototype: MobDionaReformed

- type: gene
  id: MessyDrinker
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: MessyDrinker

- type: gene
  id: ParrotSpeech
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: ActiveListener
    - type: ParrotMemory
    - type: ParrotListener
    - type: Vocalizer

- type: gene
  id: Bleating
  kind: Presence
  effects:
  - !type:AddComponents
    components:
    - type: BleatingAccent

