# Base
- type: entity
  abstract: true
  id: YellowTankBase
  parent: [StorageTankBig, StructureWheeled]
  name: yellow tank
  description: That iconic barrel of refreshing nectar.
  components:
  - type: Sprite
    sprite: _Corvax/Structures/Storage/yellow_tank.rsi
    layers:
    - state: tank
    - state: tank_kvass
  - type: Rotatable
  - type: Transform
    noRot: false
  - type: ExaminableSolution
    solution: tank
  - type: ReagentTank
    transferAmount: 100
  - type: StaticPrice
    price: 1000

# Kvass
- type: entity
  id: KvassTank
  parent: YellowTankBase
  suffix: Empty
  components:
  - type: Sprite
    layers:
    - state: tank
    - state: tank_kvass

- type: entity
  parent: KvassTank
  id: KvassTankFull
  suffix: Full
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Kvass
        Quantity: 3840

# Beer
- type: entity
  id: BeerTank
  parent: YellowTankBase
  suffix: Empty
  components:
  - type: Sprite
    layers:
    - state: tank
    - state: tank_beer

- type: entity
  parent: BeerTank
  id: BeerTankFull
  suffix: Full
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Beer
        Quantity: 3840
