- type: entity
  #parent: BaseLathe
  parent: [ BaseMachinePowered, ConstructibleMachine, BaseConstructibleMachineDestructible ]
  id: PrinterDoc
  name: document printer
  description: Bureaucratic perfection. Stores the database of all Nanotrasen documents. For rapid pre-filling of documents with your personal details, use the ID card slot. Printing is available provided paper is supplied.
  components:
  - type: Sprite
    sprite: _Corvax/Structures/Machines/printer.rsi
    snapCardinals: false # RS14
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  - type: Appearance
  - type: WiresVisuals
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Transform
    noRot: false
  - type: Machine
    board: PrinterDocMachineCircuitboard
  #- type: Lathe
  #  producingSound: /Audio/Machines/scanning.ogg
  #  idleState: icon
  #  runningState: building
  #  staticPacks:
  #  - CorvaxDocumentsPack
  #- type: EmagLatheRecipes
  #  emagStaticPacks:
  #  - CorvaxEmagDocumentsPack
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 25
        mask:
        - MachineMask
        layer:
        - MachineLayer
