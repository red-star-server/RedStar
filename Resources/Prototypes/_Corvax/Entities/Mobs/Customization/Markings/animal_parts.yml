- type: marking
  id: FoxEars
  bodyPart: HeadTop
  groupWhitelist: [ Human ]
  sprites:
  - sprite: _Corvax/Mobs/Customization/fox_parts.rsi
    state: ears_fox_outer
  - sprite: _Corvax/Mobs/Customization/fox_parts.rsi
    state: ears_fox_inner

- type: marking
  id: CatEarsStubby
  bodyPart: HeadTop
  groupWhitelist: [ Human ]
  coloring:
    default:
      type: !type:CategoryColoring { category: Hair }
      fallbackTypes:
      - !type:SkinColoring
    layers:
      ears_stubby_inner:
        type: !type:SimpleColoring { color: "#FFFFFF" }
  sprites:
