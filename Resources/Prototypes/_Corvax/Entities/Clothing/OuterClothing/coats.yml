- type: entity
  parent: [ClothingOuterStorageBase, BaseSecurityContraband]
  id: ClothingOuterCoatSecurityOvercoat
  name: security overcoat
  description: Lightly armored leather overcoat meant as casual wear for high-ranking officers. Bears the crest of Nanotrasen Security.
  components:
  - type: Sprite
    sprite: _Corvax/Clothing/OuterClothing/Coats/sec_jacket.rsi
  - type: Clothing
    sprite: _Corvax/Clothing/OuterClothing/Coats/sec_jacket.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.6
        Heat: 0.9

