name: "Changelog: Send discord webhook"

on:
  pull_request_target:
    branches: [master]
    types: [closed]

permissions:
  contents: read

jobs:
  send-discord:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Render Discord payload
        id: render
        run: |
          python3 Tools/changelogs/pr_changelog.py \
            --event-file "$GITHUB_EVENT_PATH" \
            --output-file discord_payload.json

          if [ -f discord_payload.json ]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send to Discord
        if: steps.render.outputs.should_send == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "$WEBHOOK_URL" \
            --fail \
            --silent \
            --show-error

      - name: Ping changelog waiters
        if: steps.render.outputs.should_send == 'true' && vars.CHANGELOG_DISCORD_ROLE_ID != ''
        env:
          WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
          ROLE_ID: ${{ vars.CHANGELOG_DISCORD_ROLE_ID }}
        run: |
          jq -n --arg role_id "$ROLE_ID" \
            '{content: ("<@&" + $role_id + ">"), allowed_mentions: {parse: [], roles: [$role_id]}}' |
            curl -X POST \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$WEBHOOK_URL" \
              --fail \
              --silent \
              --show-error
